# Every container caps its own logs. Without this the json-file driver is
# unbounded: on 2026-08-23 an unrotated glitchtip-worker log reached 4.0 GB,
# filled the 92 GB volume that also holds Docker's data-root, and took the
# stack down (postgres could not write postmaster.pid, so `web` would not
# start). 10m x 3 per service caps the whole stack at ~270 MB.
#
# NOTE: docker applies this at container CREATE time. Existing containers keep
# their current unbounded setting until they are recreated
# (`docker compose up -d --force-recreate <svc>`).
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: wtg
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d wtg"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [internal]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [internal]

  clickhouse:
    image: clickhouse/clickhouse-server:24-alpine
    restart: unless-stopped
    logging: *default-logging
    volumes:
      - ch-data:/var/lib/clickhouse
    ulimits:
      nofile: {soft: 262144, hard: 262144}
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 15s
      timeout: 5s
      retries: 10
    networks: [internal]

  api:
    build: ./api
    restart: unless-stopped
    logging: *default-logging
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres/wtg
      REDIS_URL: redis://redis:6379/0
      SESSION_SECRET: ${SESSION_SECRET}
      TILE_SIGNING_SECRET: ${TILE_SIGNING_SECRET}
      PADDLE_WEBHOOK_SECRET: ${PADDLE_WEBHOOK_SECRET}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER}
      SENDGRID_API_KEY: ${SENDGRID_API_KEY}
      POSTMARK_TOKEN: ${POSTMARK_TOKEN}
      SCALEWAY_SECRET_KEY: ${SCALEWAY_SECRET_KEY}
      SCALEWAY_PROJECT_ID: ${SCALEWAY_PROJECT_ID}
      SCALEWAY_EMAIL_REGION: ${SCALEWAY_EMAIL_REGION:-fr-par}
      GLITCHTIP_DSN: ${GLITCHTIP_DSN_API}
      GLITCHTIP_RELEASE: ${GLITCHTIP_RELEASE}
      ENVIRONMENT: ${APP_ENV:-prod}
      COUNTRY_DATA_DIR: /srv/wtg-data
      # Every absolute URL the API mints for somebody outside the docker
      # network is built from these: magic links, agency invites, and the
      # alert email's links and its one-click unsubscribe. Without them
      # `Settings` falls back to its dev default and production mails
      # http://localhost:3000 links to real people. Defaulted here rather than
      # required in .env so a deploy cannot come up wrong by omission — same
      # arrangement `plausible`'s BASE_URL already has below.
      PUBLIC_WEB_ORIGIN: ${PUBLIC_WEB_ORIGIN:-https://v2.wheretogoforgreatweather.com}
      # Where `/api/*` is publicly reachable. Empty tracks PUBLIC_WEB_ORIGIN,
      # which is correct while Caddy fronts both on one hostname.
      PUBLIC_API_ORIGIN: ${PUBLIC_API_ORIGIN:-}
    volumes:
      # The pipeline's `wtg publish api-data` bundle — one JSON payload per
      # country, plus the index the web generates its route tree from. Read-only
      # and mounted rather than loaded into Postgres because the pipeline runs
      # on the host (`pipeline/CLAUDE.md`) and Postgres is on the internal-only
      # network this file is forbidden from exposing to it. Same arrangement
      # Caddy has with ./tiles.
      - ./pipeline/data/final/api:/srv/wtg-data:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      internal:
        # `api` alone is not a URL a validator will accept: a single-label host
        # has no TLD, and Django's URLValidator (which GlitchTip's monitor form
        # runs) rejects it outright — the uptime monitor could not be pointed at
        # this service until it had a dotted name. `.internal` is ICANN's
        # reserved TLD for exactly this. `api:8000` keeps working everywhere it
        # is already used; this is an additional name, not a replacement.
        aliases: [api.internal]

  web:
    build:
      context: ./web
      args:
        # Same value as the runtime env below. It is passed at build time too
        # because `next build` pre-renders the country pages against it — see
        # infra/scripts/setup-build-builder.sh for the builder that can reach
        # it, and web/Dockerfile for what happens when it cannot.
        INTERNAL_API_URL: http://api:8000
        # Next inlines NEXT_PUBLIC_* into the client bundle at BUILD time, so
        # the runtime block below reaches server components only. Anything the
        # browser needs must also be here or it ships as an empty string —
        # which is exactly how client-side GlitchTip, PostHog and Plausible
        # came to be inert in production until 2026-08-17.
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
        NEXT_PUBLIC_APP_ENV: ${NEXT_PUBLIC_APP_ENV}
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_CDN_URL: ${NEXT_PUBLIC_CDN_URL}
        NEXT_PUBLIC_PLAUSIBLE_DOMAIN: ${NEXT_PUBLIC_PLAUSIBLE_DOMAIN}
        NEXT_PUBLIC_PLAUSIBLE_SRC: ${NEXT_PUBLIC_PLAUSIBLE_SRC}
        NEXT_PUBLIC_POSTHOG_KEY: ${NEXT_PUBLIC_POSTHOG_KEY}
        NEXT_PUBLIC_POSTHOG_HOST: ${NEXT_PUBLIC_POSTHOG_HOST}
        NEXT_PUBLIC_GLITCHTIP_DSN_WEB: ${NEXT_PUBLIC_GLITCHTIP_DSN_WEB}
        NEXT_PUBLIC_GLITCHTIP_RELEASE: ${NEXT_PUBLIC_GLITCHTIP_RELEASE}
        # Paddle.js cannot open a checkout without this, so an image built
        # without it has an Upgrade button that fails for every visitor.
        NEXT_PUBLIC_PADDLE_CLIENT_TOKEN: ${NEXT_PUBLIC_PADDLE_CLIENT_TOKEN}
    restart: unless-stopped
    logging: *default-logging
    environment:
      INTERNAL_API_URL: http://api:8000
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
      NEXT_PUBLIC_CDN_URL: ${NEXT_PUBLIC_CDN_URL}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
      NEXT_PUBLIC_APP_ENV: ${NEXT_PUBLIC_APP_ENV}
      NEXT_PUBLIC_PLAUSIBLE_DOMAIN: ${NEXT_PUBLIC_PLAUSIBLE_DOMAIN}
      NEXT_PUBLIC_PLAUSIBLE_SRC: ${NEXT_PUBLIC_PLAUSIBLE_SRC}
      NEXT_PUBLIC_POSTHOG_KEY: ${NEXT_PUBLIC_POSTHOG_KEY}
      NEXT_PUBLIC_POSTHOG_HOST: ${NEXT_PUBLIC_POSTHOG_HOST}
      NEXT_PUBLIC_GLITCHTIP_DSN_WEB: ${NEXT_PUBLIC_GLITCHTIP_DSN_WEB}
      NEXT_PUBLIC_GLITCHTIP_RELEASE: ${NEXT_PUBLIC_GLITCHTIP_RELEASE}
      NEXT_PUBLIC_PADDLE_CLIENT_TOKEN: ${NEXT_PUBLIC_PADDLE_CLIENT_TOKEN}
      GLITCHTIP_DSN_WEB: ${GLITCHTIP_DSN_WEB}
    depends_on:
      api:
        condition: service_healthy
    networks: [internal]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    logging: *default-logging
    # Caddy runs as PID 1 and never reaps orphans, so every process the
    # healthcheck spawns was left behind as a zombie. By 2026-08-27 that was
    # 17,025 of them, and the container's pid cgroup was full (17037/17038) —
    # at which point the healthcheck stopped failing on its own bug and started
    # failing with `wget: fork: Resource temporarily unavailable`. `init: true`
    # puts a real init (tini) at PID 1 to reap them.
    init: true
    ports: ["80:80", "443:443"]
    environment:
      # Guards the two ops subdomains; the Caddyfile reads it as
      # {env.CADDY_BASICAUTH_HASH} so no credential is committed. Deliberately
      # NOT defaulted — Caddy refuses to load the config without it, which is
      # the safe direction: a proxy that will not start beats one serving
      # GlitchTip and Plausible unauthenticated.
      CADDY_BASICAUTH_HASH: ${CADDY_BASICAUTH_HASH:?set CADDY_BASICAUTH_HASH in .env — see Caddyfile header}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
      - ./tiles:/var/tiles:ro
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    healthcheck:
      # Caddy's local admin API, NOT the public site. The previous check hit
      # `http://localhost/api/health`, which auto-HTTPS redirects to :443,
      # where Caddy holds no certificate for `localhost` and kills the
      # handshake with `tlsv1 alert internal error`. It had therefore never
      # passed once in ~146 days (failing streak 35,120) while the proxy was
      # serving perfectly — so the signal was pure noise and got ignored.
      #
      # 127.0.0.1 rather than `localhost`: admin binds IPv4-only, and busybox
      # wget resolves `localhost` to ::1 first and gets connection refused.
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:2019/config/"]
      interval: 15s
      timeout: 5s
      retries: 10
    networks: [internal, public]

  glitchtip-web:
    image: glitchtip/glitchtip:latest
    restart: unless-stopped
    logging: *default-logging
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres/glitchtip
      SECRET_KEY: ${GLITCHTIP_SECRET_KEY}
      REDIS_URL: redis://redis:6379/1
      EMAIL_URL: ${GLITCHTIP_EMAIL_URL}
      GLITCHTIP_DOMAIN: http://localhost
      # The uptime monitor rejects any target resolving to a private IP —
      # sound SSRF protection on a shared instance, but self-defeating here.
      # These containers sit on an `internal: true` network with no egress, so
      # the only addresses they can reach ARE private; with the guard on, the
      # form accepts a URL only when its hostname fails to resolve — that is,
      # only when the monitor can never pass. Not hypothetical: the first
      # monitor saved cleanly against the public hostname and then sat "down"
      # for 13 days, one failed DNS lookup a minute. This instance has one
      # human user behind basic auth, so the guard defends nothing reachable.
      GLITCHTIP_UPTIME_ALLOW_PRIVATE_IPS: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [internal]

  glitchtip-worker:
    image: glitchtip/glitchtip:latest
    restart: unless-stopped
    logging: *default-logging
    command: ./bin/run-celery-with-beat.sh
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres/glitchtip
      SECRET_KEY: ${GLITCHTIP_SECRET_KEY}
      REDIS_URL: redis://redis:6379/1
      GLITCHTIP_DOMAIN: http://localhost
      # Same setting as glitchtip-web above: the web container validates the
      # monitor on save, this one runs the checks. Both need it, or a monitor
      # saved through the form is refused again at check time.
      GLITCHTIP_UPTIME_ALLOW_PRIVATE_IPS: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [internal]

  plausible:
    image: ghcr.io/plausible/community-edition:latest
    restart: unless-stopped
    logging: *default-logging
    command: sh -c "/entrypoint.sh db createdb && /entrypoint.sh db migrate && /entrypoint.sh run"
    environment:
      BASE_URL: https://v2.wheretogoforgreatweather.com/_plausible
      SECRET_KEY_BASE: ${PLAUSIBLE_SECRET_KEY_BASE}
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres/plausible
      CLICKHOUSE_DATABASE_URL: http://clickhouse:8123/plausible
      DISABLE_REGISTRATION: invite_only
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    networks: [internal]

volumes:
  pg-data:
  ch-data:
  caddy-data:
  caddy-config:

networks:
  internal:
    internal: true
  public:
